<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ícone — Pixelverso</title>
<link rel="icon" href="data:,">
<style>html,body{margin:0;background:#000}canvas{image-rendering:pixelated;max-width:100vw}</style>
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js" } }</script>
</head>
<body>
<script type="module">
// Foto de perfil do canal "Pixelverso": 200x200 ampliada 4x (800x800). O YouTube corta em círculo (raio ~95).
// A Bia em pé num planetinha feito dos mundos do canal (castelo, cidade, fábrica, blocos), num céu de estrelas colorido.
import { criarTela, quadro, desenharSprite, finalizar, Pix, misturar } from './comum.js';

const T = criarTela(200, 200, 21), { p, rnd, brilho } = T, CX = 100, CY = 100;
// céu: roxo/azul vivo (não escuro), com estrelas
const CEU = ['#2a3a9a', '#3a4ab0', '#5a52c0', '#7a5ac8', '#9a62c8', '#c070c0'];
for (let y = 0; y < 200; y++) for (let x = 0; x < 200; x++) p.set(x, y, Pix.tom(CEU, Math.pow(y / 200, 1.1), x, y));
for (let i = 0; i < 90; i++) {
  const x = Math.floor(rnd() * 200), y = Math.floor(rnd() * 150), f = rnd();
  p.set(x, y, f > 0.8 ? '#ffffff' : '#c8c0ff');
  if (f > 0.93) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) p.set(x + dx, y + dy, '#9a90e8');
}
// cubos flutuando no espaço
desenharSprite(T, quadro('peca-vermelha'), 40, 70, 1);
desenharSprite(T, quadro('cubo-grama'), 171, 134, 1);
desenharSprite(T, quadro('moeda-bloco'), 62, 40, 1);
desenharSprite(T, quadro('moeda-bloco'), 172, 92, 1);

// planeta (menor e mais redondo; o topo fica logo abaixo dos pés da Bia)
const PX = 100, PY = 222, PR = 96;
const sup = (x) => Math.round(PY - Math.sqrt(Math.max(0, PR * PR - (x - PX) ** 2))); // altura da superfície em x
const mundo = (x, y) => {
  const a = Math.atan2(y - PY, x - PX) * 180 / Math.PI; // -180..0 em cima
  return a < -125 ? 'medieval' : a < -90 ? 'cidade' : a < -55 ? 'fabrica' : 'blocos';
};
// 1) as construções vêm ANTES do planeta e descem até o fundo: a borda do planeta cobre a base (ficam plantadas na curva)
const SIL = '#3a2b2b';
// castelo (esquerda): torre de pedra com telhado vermelho e bandeirinha
{ const x0 = 26, w = 18, topo = sup(x0 + w / 2) - 32;
  p.ret(x0, topo, w, 200 - topo, '#b4b0c0'); for (let i = 0; i < w; i += 4) p.ret(x0 + i, topo - 3, 3, 3, '#b4b0c0');
  for (let y = topo; y < 200; y += 5) p.ret(x0, y, w, 1, '#8e8aa0'); p.ret(x0 + w - 1, topo, 1, 200 - topo, '#8e8aa0');
  for (let i = 0; i < 12; i++) { const l = Math.round(11 * (i / 12)); p.ret(x0 + 9 - l, topo - 15 + i, 2 * l + 1, 1, i < 2 ? '#e07a6a' : '#c0504a'); }
  p.ret(x0 + 9, topo - 21, 1, 6, '#6b5a50'); p.ret(x0 + 10, topo - 21, 5, 3, '#e8c040');
  p.ret(x0 + 4, topo + 8, 3, 4, '#3a2b40'); p.ret(x0 + 11, topo + 8, 3, 4, '#3a2b40'); p.ret(x0 + 6, topo + 18, 6, 14, SIL); }
// prédio da cidade (perto da Bia, à esquerda)
{ const x0 = 50, w = 22, topo = sup(x0 + w / 2) - 34;
  p.ret(x0, topo, w, 200 - topo, '#e9a882'); p.ret(x0 - 2, topo - 3, w + 4, 3, '#5b6fa8'); p.ret(x0 + w - 1, topo, 1, 200 - topo, '#d48d66');
  for (const [dx, dy] of [[3, 6], [13, 6], [3, 18], [13, 18]]) { p.ret(x0 + dx - 1, topo + dy - 1, 7, 8, '#4a3a3a'); p.ret(x0 + dx, topo + dy, 5, 6, '#ffe7b0'); } }
// fábrica com chaminé e fumaça (direita)
{ const x0 = 130, w = 26, topo = sup(x0 + w / 2) - 26;
  p.ret(x0 + 17, topo - 20, 7, 30, '#b05a40'); p.ret(x0 + 16, topo - 22, 9, 3, '#6a3a2e');
  for (let i = 0; i < 3; i++) p.circulo(x0 + 21 + i * 4, topo - 26 - i * 6, 3 + i, (x, y, dx, dy) => (dy > 0.3 ? '#c8c4cc' : '#eceaf0'));
  p.ret(x0, topo, w, 200 - topo, '#c06848'); for (let y = topo; y < 200; y += 5) p.ret(x0, y, w, 1, '#9a4c36');
  for (let i = 0; i < 3; i++) for (let k = 0; k < 5; k++) p.ret(x0 + i * 9 + k, topo - 5 + k, 1, 5 - k, '#6a4a5a'); // telhado em dente
  for (const dx of [3, 12]) { p.ret(x0 + dx - 1, topo + 6, 7, 8, '#4a2a2a'); p.ret(x0 + dx, topo + 7, 5, 6, '#ffe3a0'); } }
// 2) o planeta por cima: cada fatia é o chão de um mundo
brilho(PX, PY, PR + 18, '#ffd6f0', 0.35);
p.circulo(PX, PY, PR, (x, y) => {
  const d = Math.hypot(x + 0.5 - PX, y + 0.5 - PY), borda = PR - d, m = mundo(x, y);
  const tom = (cores) => Pix.tom(cores, Math.min(1, borda / 50), x, y);
  if (m === 'medieval') {
    if (borda < 3) return '#7ac05a';
    const lin = Math.floor(y / 6), col = (x + lin * 4) % 9;
    return y % 6 === 0 || col === 0 ? tom(['#8a7a68', '#5a4e44']) : tom(['#c8b89c', '#8a7a68']);
  }
  if (m === 'cidade') {
    if (borda < 2) return '#e6ddd0'; if (borda < 4) return '#b8aea2';
    return borda > 12 && borda < 14 && Math.floor(x / 5) % 2 ? '#f0e6c8' : tom(['#5e6270', '#3a3c48']);
  }
  if (m === 'fabrica') return borda < 3 ? (Math.floor(x / 3) % 2 ? '#f0c030' : '#2a2a2a') : tom(['#b8b4ac', '#7a7670']);
  const px = ((x % 6) + 6) % 6, py = ((y % 6) + 6) % 6; // pinos do jogo de blocos
  return px >= 2 && px <= 3 && py >= 2 && py <= 3 ? tom(['#8ae070', '#4a9a3a']) : tom(['#5ac04a', '#2e7a2a']);
});
for (const ang of [-125, -90, -55]) { // fendas brilhantes entre os mundos (como no banner)
  const r = ang * Math.PI / 180;
  for (let k = 0; k < PR; k++) {
    const x = Math.round(PX + Math.cos(r) * k), y = Math.round(PY + Math.sin(r) * k);
    p.set(x, y, '#ffffff'); p.set(x + 1, y, misturar(T.get(x + 1, y), '#ff7ad9', 0.5)); p.set(x - 1, y, misturar(T.get(x - 1, y), '#7af0ff', 0.5));
  }
}
// contorno escuro da borda do planeta (separa do céu)
for (let y = 0; y < 200; y++) for (let x = 0; x < 200; x++) { const d = Math.hypot(x + 0.5 - PX, y + 0.5 - PY); if (d > PR && d <= PR + 1) p.set(x, y, '#2a1a3a'); }

// a Bia em pé no topo do planeta
const bia = quadro('menina-capa', 'parado');
const ESC = 2, PES = PY - PR + 2, ox = Math.round(PX - (bia.w * ESC) / 2), oy = PES - bia.base * ESC;
for (const [x, y] of bia.px) p.ret(ox + x * ESC - 1, oy + y * ESC - 1, ESC + 2, ESC + 2, '#2a1a3a');
desenharSprite(T, bia, PX, PES, ESC);

// aro no limite do círculo
for (let y = 0; y < 200; y++) for (let x = 0; x < 200; x++) {
  const d = Math.hypot(x + 0.5 - CX, y + 0.5 - CY);
  if (d > 94 && d <= 97) p.set(x, y, '#ffc23c');
  else if (d > 97 && d <= 98.5) p.set(x, y, '#8a4a1a');
  else if (d > 98.5) p.set(x, y, '#1e1430');
}
finalizar(T, 4);
</script>
</body>
</html>
