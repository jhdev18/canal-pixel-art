<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ícone — Vila Serena</title>
<link rel="icon" href="data:,">
<style>html,body{margin:0;background:#000}canvas{image-rendering:pixelated;max-width:100vw}</style>
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js" } }</script>
</head>
<body>
<script type="module">
// Foto de perfil do canal "Vila Serena": 200x200 ampliada 4x (800x800). O YouTube corta em círculo (raio ~95).
// A Bia de perto, de dia, com os telhados da cidade atrás.
import { criarTela, quadro, desenharSprite, finalizar, Pix, misturar } from './comum.js';

const T = criarTela(200, 200, 11), { p, brilho } = T, CX = 100, CY = 100;
const CEU = ['#3f8fd8', '#4f9fe0', '#64b0e8', '#7cc0ee', '#98d0f2', '#b6def4', '#d4ebf2'];
for (let y = 0; y < 200; y++) for (let x = 0; x < 200; x++) p.set(x, y, Pix.tom(CEU, Math.pow(y / 150, 1.2), x, y));
// sol no canto (longe da capa amarela)
brilho(158, 42, 46, '#fff6c8', 0.6);
p.circulo(158, 42, 16, (x, y, dx, dy) => (dx + dy > 0.8 ? '#ffd65a' : dx + dy < -0.7 ? '#fffbe0' : '#ffe98a'));
// nuvens
for (const [cx, cy, r] of [[26, 62, 9], [38, 58, 11], [50, 64, 8], [132, 76, 6], [142, 72, 8], [152, 77, 6]]) {
  p.circulo(cx, cy + 2, r, '#b9d6ea'); p.circulo(cx, cy, r, (x, y, dx, dy) => (dy > 0.45 ? '#dcebf4' : '#ffffff'));
}
// telhados da cidade
const casa = (x, w, topo, parede, telh) => {
  p.ret(x, topo, w, 200 - topo, parede);
  for (let i = 0; i < 6; i++) p.ret(x - 3 + i, topo - 6 + i, w + 6 - 2 * i, 1, i === 0 ? misturar(telh, '#ffffff', 0.3) : telh);
  for (let jx = x + 4; jx < x + w - 6; jx += 12) { p.ret(jx - 1, topo + 7, 8, 10, '#4a3a3a'); p.ret(jx, topo + 8, 6, 8, '#bfe4f6'); p.ret(jx, topo + 8, 6, 2, '#e8f6fc'); }
};
casa(0, 46, 128, '#f6e2b4', '#a8603c');
casa(44, 40, 116, '#e9a882', '#5b6fa8');
casa(118, 40, 120, '#9fb7d6', '#34466e');
casa(156, 48, 132, '#bfe0b0', '#4f8a4a');
// a Bia grande
const bia = quadro('menina-capa', 'parado');
const ESC = 4, PES = 54 + bia.base * ESC;
// contorno escuro em volta dela, para destacar do fundo
const ox = Math.round(CX - (bia.w * ESC) / 2), oy = PES - bia.base * ESC;
for (const [x, y] of bia.px) p.ret(ox + x * ESC - 2, oy + y * ESC - 2, ESC + 4, ESC + 4, '#2a1a14');
desenharSprite(T, bia, CX, PES, ESC);
// aro dourado no limite do círculo
for (let y = 0; y < 200; y++) for (let x = 0; x < 200; x++) {
  const d = Math.hypot(x + 0.5 - CX, y + 0.5 - CY);
  if (d > 94 && d <= 97) p.set(x, y, '#ffc23c');
  else if (d > 97 && d <= 98.5) p.set(x, y, '#8a4a1a');
  else if (d > 98.5) p.set(x, y, '#2a1a14');
}
finalizar(T, 4);
</script>
</body>
</html>
