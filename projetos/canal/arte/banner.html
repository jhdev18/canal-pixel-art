<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Banner — Vila Serena</title>
<link rel="icon" href="data:,">
<style>html,body{margin:0;background:#000}canvas{image-rendering:pixelated;max-width:100vw}</style>
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js" } }</script>
</head>
<body>
<script type="module">
// Banner do canal "Vila Serena": 640x360 ampliado 4x (2560x1440).
// Área segura do YouTube (1546x423 no centro) = x 127..513, y 127..233 na resolução baixa.
// De dia, a rua da cidade; todas as sombras vão para a direita, a da Bia vai para a esquerda.
import { criarTela, quadro, desenharSprite, sombra, titulo, finalizar, Pix, misturar, larguraTexto } from './comum.js';
import { desenharTexto } from '/motor/fonte.js';

const T = criarTela(640, 360, 5), { p, rnd, brilho, escurecer, W, H } = T;
const BASE = 268; // pé dos prédios

// ---------- céu de dia ----------
const CEU = ['#3f8fd8', '#4f9fe0', '#64b0e8', '#7cc0ee', '#98d0f2', '#b6def4', '#d4ebf2', '#f2efd8'];
for (let y = 0; y < BASE; y++) for (let x = 0; x < W; x++) p.set(x, y, Pix.tom(CEU, Math.pow(y / BASE, 1.2), x, y));
// sol (canto de cima à esquerda: as sombras vão para a direita)
brilho(70, 46, 90, '#fff6c8', 0.55);
p.circulo(70, 46, 20, (x, y, dx, dy) => (dx + dy > 0.7 ? '#ffd65a' : dx + dy < -0.6 ? '#fffbe0' : '#ffe98a'));
// nuvens fofas
const nuvem = (cx, cy, n) => {
  const bolas = [];
  for (let i = 0; i < n; i++) bolas.push([cx + i * 9 - n * 4.5, cy - Math.sin((i + 0.5) / n * Math.PI) * 8, 7 + Math.sin((i + 0.5) / n * Math.PI) * 6]);
  for (const [x, y, r] of bolas) p.circulo(x, y + 2, r, '#b9d6ea');
  for (const [x, y, r] of bolas) p.circulo(x, y, r, (px, py, dx, dy) => (dy > 0.45 ? '#dcebf4' : '#ffffff'));
  p.ret(cx - n * 4.5 - 4, cy + 2, n * 9 + 2, 5, '#dcebf4');
};
nuvem(200, 60, 5); nuvem(470, 40, 6); nuvem(590, 96, 3); nuvem(330, 104, 3); nuvem(30, 128, 3);
// passarinhos
for (const [x, y] of [[250, 40], [262, 46], [528, 120], [540, 114]]) { p.set(x - 2, y - 1, '#2b3a5c'); p.set(x - 1, y, '#2b3a5c'); p.set(x, y - 1, '#2b3a5c'); p.set(x + 1, y, '#2b3a5c'); p.set(x + 2, y - 1, '#2b3a5c'); }

// ---------- morros ao fundo ----------
for (let x = 0; x < W; x++) {
  const a = 206 - 16 * Math.sin(x * 0.017 + 0.8) - 6 * Math.sin(x * 0.05);
  for (let y = Math.floor(a); y < BASE; y++) p.set(x, y, Pix.tom(['#8fc79a', '#76b388'], (y - a) / 30, x, y));
  const b = 222 - 10 * Math.sin(x * 0.023 + 2.4) - 4 * Math.sin(x * 0.09);
  for (let y = Math.floor(b); y < BASE; y++) p.set(x, y, Pix.tom(['#67a86f', '#4f9160'], (y - b) / 30, x, y));
}

// ---------- prédios da rua ----------
const tijolos = (x, y, w, h, cor, junta) => {
  p.ret(x, y, w, h, cor);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const lin = (y + j) % 5 === 0, col = ((x + i) + (Math.floor((y + j) / 5) % 2) * 4) % 8 === 0;
    if (lin || col) p.set(x + i, y + j, junta);
  }
};
const janela = (x, y, w = 8, h = 10, luz = '#bfe4f6') => {
  p.ret(x - 1, y - 1, w + 2, h + 2, '#4a3a3a'); p.ret(x, y, w, h, luz);
  p.ret(x, y, w, 2, '#e8f6fc'); p.ret(x + Math.floor(w / 2), y, 1, h, '#4a3a3a'); p.ret(x - 2, y + h + 1, w + 4, 2, '#d8cbb8');
};
const porta = (x, w, h, cor) => { p.ret(x - 1, BASE - h - 1, w + 2, h + 1, '#3a2b2b'); p.ret(x, BASE - h, w, h, cor); p.set(x + w - 3, BASE - Math.floor(h / 2), '#ffd65a'); };
const toldo = (x, y, w, c1, c2) => {
  for (let i = 0; i < w; i++) { const c = Math.floor(i / 5) % 2 ? c1 : c2; p.ret(x + i, y, 1, 6, c); if (i % 5 === 2) p.set(x + i, y + 6, c); }
  p.ret(x, y, w, 1, '#ffffff');
};
const letreiro = (x, y, w, texto, fundo, letra) => {
  p.ret(x - 1, y - 1, w + 2, 11, '#3a2b2b'); p.ret(x, y, w, 9, fundo);
  const ctx = { _c: letra, set fillStyle(v) { this._c = v; }, fillRect(a, b, c, d) { p.ret(a, b, c, d, this._c); } };
  desenharTexto(ctx, texto, x + Math.round((w - larguraTexto(texto)) / 2), y + 1, letra);
};
const telhado = (x, w, topo, cor, escura) => { p.ret(x - 3, topo - 4, w + 6, 4, cor); p.ret(x - 3, topo - 1, w + 6, 1, escura); p.ret(x - 3, topo - 5, w + 6, 1, misturar(cor, '#ffffff', 0.3)); };
const predio = (x, w, h, cor, junta, telh, telhEsc) => { tijolos(x, BASE - h, w, h, cor, junta); telhado(x, w, BASE - h, telh, telhEsc); p.ret(x + w - 1, BASE - h, 1, h, junta); };

// casa à esquerda
predio(-4, 60, 62, '#f2c6a0', '#e0ad86', '#c0504a', '#8e3632');
janela(8, 222); janela(34, 222); porta(18, 12, 20, '#7a4f3a');
// padaria
predio(60, 84, 74, '#f6e2b4', '#e6cb92', '#a8603c', '#7c4428');
letreiro(72, 206, 60, 'PADARIA', '#fff3d6', '#8a4a26'); toldo(64, 226, 76, '#e06a5a', '#fff3e8');
janela(70, 236, 18, 14, '#ffe7b0'); janela(116, 236, 18, 14, '#ffe7b0'); porta(95, 14, 24, '#8a5a3a');
for (let i = 0; i < 4; i++) p.elipse(74 + i * 4, 247, 2, 1.2, '#c9873e'); // pães na vitrine
// escola (mais alta, com sino)
predio(150, 104, 98, '#e9a882', '#d48d66', '#5b6fa8', '#3e4f80');
p.ret(190, 154, 24, 14, '#5b6fa8'); for (let i = 0; i < 12; i++) p.ret(190 + i, 154 - i, 24 - 2 * i, 1, '#6d82bc');
p.ret(199, 156, 6, 7, '#3e4f80'); p.ret(200, 157, 4, 4, '#ffd65a');
letreiro(172, 186, 60, 'ESCOLA', '#fff8e6', '#3e4f80');
for (const x of [160, 180, 216, 236]) janela(x, 202, 8, 10);
for (const x of [160, 236]) janela(x, 230, 8, 12);
porta(192, 20, 30, '#4f7a5a'); p.ret(201, BASE - 30, 1, 30, '#2f4a36');
// prédio de apartamentos (atrás do título; mais baixo)
predio(260, 76, 86, '#c9d6e0', '#b0c0cc', '#6a7684', '#4a5462');
for (const y of [192, 214, 238]) for (const x of [270, 290, 310]) janela(x, y, 8, 10, y === 214 && x === 290 ? '#ffe7b0' : '#bfe4f6');
p.ret(276, 207, 22, 2, '#8a96a4'); // varanda
// delegacia
predio(342, 92, 82, '#9fb7d6', '#86a0c2', '#34466e', '#232f4c');
letreiro(358, 198, 60, 'DELEGACIA', '#ffffff', '#34466e');
for (const x of [352, 372, 406, 424]) janela(x, 216, 7, 10);
porta(380, 20, 28, '#34466e'); p.ret(389, BASE - 28, 1, 28, '#232f4c');
p.ret(388, 192, 4, 4, '#e04a4a'); p.ret(392, 192, 4, 4, '#4a7ae0'); // luzinha
// mercado
predio(440, 98, 66, '#bfe0b0', '#a4c994', '#4f8a4a', '#36662f');
letreiro(456, 210, 66, 'MERCADO', '#fffbe6', '#36662f'); toldo(444, 228, 90, '#4f9a5a', '#fff8e0');
janela(452, 238, 20, 14, '#e6f6d8'); porta(484, 16, 26, '#5a7a4a'); janela(508, 238, 20, 14, '#e6f6d8');
for (let i = 0; i < 3; i++) { p.ret(452 + i * 7, 258, 6, 8, '#a8743e'); p.ret(453 + i * 7, 257, 4, 2, ['#e04a3a', '#f0c040', '#6ab84a'][i]); } // caixotes de fruta
// casa à direita
predio(544, 100, 70, '#f6d6e2', '#e6bccc', '#7a5aa8', '#56407c');
janela(556, 214); janela(584, 214); janela(612, 214); janela(556, 240); janela(612, 240); porta(582, 14, 22, '#7a5aa8');
// pombo no telhado da escola
desenharSprite(T, quadro('pombo-fofoqueiro'), 120, BASE - 74 - 4, 1);

// ---------- calçada de trás, rua, calçada da frente ----------
for (let y = BASE; y < 282; y++) for (let x = 0; x < W; x++) p.set(x, y, (x % 16 === 0 || y === 275) ? '#b8aea2' : '#d6ccbe');
p.ret(0, 280, W, 2, '#9a9086');
for (let y = 282; y < 320; y++) for (let x = 0; x < W; x++) p.set(x, y, Pix.tom(['#5e6270', '#53566a'], (y - 282) / 38, x, y));
for (let x = 6; x < W; x += 28) p.ret(x, 300, 14, 2, '#f0e6c8');
p.ret(0, 320, W, 3, '#b8aea2'); p.ret(0, 320, W, 1, '#e6ddd0');
for (let y = 323; y < H; y++) for (let x = 0; x < W; x++) p.set(x, y, ((x + (y > 341 ? 8 : 0)) % 16 === 0 || y === 341) ? '#c4baae' : '#e2d8ca');
// postes
for (const x of [26, 612]) { p.ret(x, 252, 3, 72, '#4a5462'); p.ret(x - 3, 250, 9, 4, '#4a5462'); p.ret(x - 2, 254, 7, 2, '#fff3c0'); }

// ---------- personagens na calçada da frente (todas as sombras para a direita; a da Bia para a esquerda) ----------
const PES = 330, ESC = 2;
const SOMBRA = { comp: 0.75, achatar: 0.3, cor: '#2e2848', forca: 0.6 };
const turma = [
  ['padeiro', 'rosto-feliz', 40, 1], ['prefeito', 'parado', 130, 1],
  ['menina-capa', 'rosto-pensativo', 320, -1],
  ['rival', 'rosto-surpreso', 440, 1], ['aluno', 'rosto-assustado', 540, 1],
];
const sprites = turma.map(([n, a]) => quadro(n, a));
turma.forEach(([n, , x, dir], i) => sombra(T, sprites[i], x, PES, ESC, dir, SOMBRA));
turma.forEach(([n, , x], i) => desenharSprite(T, sprites[i], x, PES, ESC));
// gatinho de chapéu perto do mercado (com a sombra dele também para a direita)
const gato = quadro('gato-chapeu');
sombra(T, gato, 384, PES - 2, 1, 1, SOMBRA);
desenharSprite(T, gato, 384, PES - 2, 1);

// ---------- título ----------
const limites = [];
const t1 = titulo(T, 'VILA SERENA', 6, 138, ['#fff6d0', '#ffe68a', '#ffd04a', '#ffb43c', '#f08a2e'], { contorno: '#3a1e14', sombraCor: '#1e0e08' });
limites.push(t1);
const SUB = 'CIDADE CALMA. REGRAS ESTRANHAS.';
const esc2 = larguraTexto(SUB, 2) <= 380 ? 2 : 1;
// faixa atrás do subtítulo, para ler em cima dos prédios
const wSub = larguraTexto(SUB, esc2), ySub = 200;
for (let y = ySub - 5; y < ySub + 7 * esc2 + 5; y++) for (let x = 320 - wSub / 2 - 10; x < 320 + wSub / 2 + 10; x++) {
  const borda = x < 320 - wSub / 2 - 8 || x >= 320 + wSub / 2 + 8 || y === ySub - 5 || y === ySub + 7 * esc2 + 4;
  p.set(x, y, borda ? '#3a1e14' : '#fff3d6');
}
limites.push(titulo(T, SUB, esc2, ySub, ['#6a2e1a', '#4a1e10'], { contorno: '#fff3d6', sombraCor: '#fff3d6' }));

finalizar(T, 4, limites);
</script>
</body>
</html>
